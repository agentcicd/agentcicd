[pytest]
testpaths =
    tests/project
addopts =
    -m "not spark and not e2e and not external"
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    spark: requires a local Spark installation
    e2e: exercises a full local runtime
    e2e_smoke: curated end-to-end smoke test
    external: touches external services
