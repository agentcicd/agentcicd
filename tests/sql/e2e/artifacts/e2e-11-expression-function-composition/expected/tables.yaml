tables:
  normalized:
    rows:
      - match: {case_id.value: expr-001}
        cells:
          score: {approx: 0.8, errors: []}
          not_flag: {value: false, errors: []}
          message_norm: {value: hello world, errors: []}
          payload: {value_type: json, errors: []}
      - match: {case_id.value: expr-002}
        cells:
          message_norm: {errors: [AGENTCICD_RUNTIME_PYTHON_ERROR]}
      - match: {case_id.value: expr-003}
        cells:
          score: {errors: [AGENTCICD_CAST_ERROR]}
  composed:
    rows:
      - match: {case_id.value: expr-001}
        cells:
          neg_score: {approx: -0.8, errors: []}
          weighted_score: {approx: 0.9, errors: []}
          label: {value: "hello world:2", errors: []}
          eligible: {value: true, errors: []}
          embedding_model: {value: bge, errors: []}
          route: {value: clean, errors: []}
      - match: {case_id.value: expr-002}
        cells:
          label: {value: "fallback text:0", errors: []}
          embedding_model: {value: bge, errors: []}
          route: {value: message-error, errors: []}
      - match: {case_id.value: expr-003}
        cells:
          weighted_score: {value: 0.0, errors: []}
          embedding_model: {value: fallback-model, errors: []}
          route: {value: score-error, errors: []}
